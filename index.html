
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chamikara Wijerathne</title>

    <meta name="description" content="Chamikara Wijerathne's professional portfolio. Website currently undergoing maintenance.">
    <meta name="author" content="Chamikara Wijerathne">
    <meta name="theme-color" content="#080d19">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="grid-pattern"></div>
    </div>

    <main class="container">

        <header class="header">
            <a href="/" class="logo">
                <span class="logo-mark">CW.</span>
                <span class="logo-name">CHAMIKARA WIJERATHNE</span>
            </a>

            <div class="availability">
                <span class="status-dot"></span>
                Portfolio in progress
            </div>
        </header>

        <section class="hero">

            <div class="orbit-container" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="orbit orbit-three"></div>

                <div class="orbit-center">
                    <span>01</span>
                </div>
            </div>

            <div class="hero-content">

                <div class="eyebrow">
                    <span class="eyebrow-line"></span>
                    PERSONAL PORTFOLIO
                    <span class="eyebrow-line"></span>
                </div>

                <h1>
                    Something<br>
                    <span class="gradient-text">is taking shape.</span>
                </h1>

                <p class="description">
                    I'm currently working on my personal website.
                </p>

                <div class="maintenance-card">

                    <div class="maintenance-icon">
                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v3"/>
                            <path d="M12 18v3"/>
                            <path d="m4.22 4.22 2.12 2.12"/>
                            <path d="m17.66 17.66 2.12 2.12"/>
                            <path d="M3 12h3"/>
                            <path d="M18 12h3"/>
                            <path d="m4.22 19.78 2.12-2.12"/>
                            <path d="m17.66 6.34 2.12-2.12"/>
                            <circle cx="12" cy="12" r="4"/>
                        </svg>
                    </div>

                    <div class="maintenance-info">
                        <h2>Under Maintenance</h2>
                        <p>Building something worth visiting.</p>
                    </div>

                    <span class="loading-indicator"></span>

                </div>

                <div class="bottom-message">
                    <span class="small-dot"></span>
                    Thank you for stopping by. See you soon.
                </div>

            </div>

        </section>

        <footer class="footer">
            <p>© <span id="year"></span> Chamikara Wijerathne</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
